[package]
name = "fmgssh"
version = "1.2.1"
description = "FgmSSH Tauri v2 migration"
authors = ["FgmSSH"]
edition = "2021"

# 绾?Rust 浼樺厛, 閬垮厤 C 渚濊禆缂栬瘧闂 (SPEC 绗?5 鑺?銆?
# 鐗堟湰鍙蜂娇鐢ㄥ鏉句絾鍚堢悊鐨勬渶鏂扮ǔ瀹氳寖鍥? 鐢?cargo build 鏃惰В鏋愩€?
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# SSH / SFTP (绾?Rust)
# 娉ㄦ剰: 浠ｇ爜鎸?russh 0.44.x 鐨?API 缂栧啓 (Channel<Msg> / channel.wait() / check_server_key 绛?銆?
# 0.45+ 鐨?API 鍙樺寲杈冨ぇ (Channel 娉涘瀷鏀逛负 Send: From<(ChannelId, ChannelMsg)> 绛?,
# 鍥犳閿佸畾 0.44 澶х増鏈? 閬垮厤 cargo 瑙ｆ瀽鍒?0.45+ 瀵艰嚧澶ч潰绉紪璇戦敊璇€?
# 鑻ュ悗缁鍗囩骇 russh, 闇€鎸夋柊 API 閲嶅啓 ssh.rs / sftp.rs / tunnel.rs / monitor.rs銆?
russh = "0.44"
# 娉ㄦ剰: russh-sftp 鏃?0.44 鐗堟湰 (鐗堟湰绾夸负 0.3 -> 1.x -> 2.x)銆?
# russh 0.44.1 瀹樻柟 sftp 绀轰緥閿佸畾鐨勯厤濂楃増鏈负 2.0.0-beta.2 (dev-dependencies 鍘熸枃)銆?
# 鐢?"=2.0.0-beta.2" 绮剧‘閿佺増: caret 鐨?prerelease 璇箟浼氬彇 2.0.0-beta.5, 閬垮厤 API 婕傜Щ銆?
russh-sftp = "=2.0.0-beta.2"
async-trait = "0.1"
# 淇: russh-sftp 2.0.0-beta.2 涓?bytes >= 1.10 (Buf trait 鏂板 try_get_* 鏂规硶)
# 浜х敓鏂规硶姝т箟 (E0034, de.rs 涓?try_get_u32/u64 澶氬), 绮剧‘閿?1.9.0 瑙勯伩銆?
bytes = "=1.9.0"

# DPAPI 鍑嵁鍔犲瘑 (Windows): 浠呭垪鍑虹敤鍒扮殑 feature
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Security_Cryptography",
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_Memory",
] }

# 闈?Windows 骞冲彴: DPAPI 涓嶅彲鐢? credential 妯″潡闄嶇骇 (encrypt 杩斿洖 None, fail-closed)

# config-portable 鍏煎: AES-256-GCM + scrypt
aes-gcm = "0.10"
scrypt = "0.11"
rand = "0.8"
# aes-gcm 0.10.3 鐨?Nonce 鐩存帴娉涘瀷浜?typenum 澶у皬 (濡?U12), 鏄惧紡寮曞叆 typenum
typenum = "1"

# 鏂囦欢澶逛笅杞芥墦鍖?
zip = "2"

# 瀹¤鏃堕棿鎴?
chrono = "0.4"
# 瀹¤鑴辨晱姝ｅ垯 (绾?Rust)
regex = "1"
# 鎸囩汗/鍝堝笇 (绾?Rust)
sha2 = "0.10"
md5 = "0.7"

# 鏇存柊妫€鏌?(rustls, 鏃?OpenSSL)
ureq = { version = "2", features = ["tls"] }

# base64 缂栬В鐮?
base64 = "0.22"

[lib]
name = "fmgssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
